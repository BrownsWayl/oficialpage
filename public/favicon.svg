<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 金色主渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="40%" stop-color="#F39800" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 背景深邃黑金渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18202F" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>

    <!-- 边框高光渐变 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39800" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- 1. 背景圆角矩形 -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- 2. 微弱内发光装饰线 -->
  <rect x="12" y="12" width="104" height="104" rx="20" fill="none" stroke="rgba(243, 152, 0, 0.15)" stroke-width="1.5" />

  <!-- 3. DS 黄金艺术标识 -->
  <text 
    x="50%" 
    y="56%" 
    text-anchor="middle" 
    dominant-baseline="central"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900" 
    font-size="52" 
    letter-spacing="-1.5"
    fill="url(#goldGrad)"
    style="text-shadow: 0 4px 12px rgba(243, 152, 0, 0.4);"
  >DS</text>

  <!-- 4. 右上角尊贵金融金星/火花点缀 -->
  <path d="M96 26 L98 32 L104 34 L98 36 L96 42 L94 36 L88 34 L94 32 Z" fill="#FFD700" opacity="0.9" />
</svg>
